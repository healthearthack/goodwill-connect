<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Goodwill Connect - HubSpot CRM Card</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 12px;
      background: #ffffff;
      color: #33475b;
      font-size: 13px;
    }
    .crm-card-wrap {
      border: 1px solid #cbd6e2;
      border-radius: 6px;
      padding: 12px;
      background: #fdfdfd;
    }
    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #eaf0f6;
      padding-bottom: 8px;
      margin-bottom: 10px;
    }
    .badge {
      background: #ecfdf5;
      color: #047857;
      border: 1px solid #a7f3d0;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 700;
    }
    .row {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
      border-bottom: 1px solid #f8fafc;
    }
    .label { color: #7c98b6; font-weight: 500; }
    .val { color: #33475b; font-weight: 700; }
    .btn-row {
      display: flex;
      gap: 6px;
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid #eaf0f6;
    }
    .btn {
      background: #4338ca;
      color: #ffffff;
      padding: 5px 10px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      text-decoration: none;
      display: inline-block;
    }
    .btn-secondary {
      background: #eaf0f6;
      color: #33475b;
    }
  </style>
</head>
<body>
  <div class="crm-card-wrap">
    <div class="header-row">
      <strong style="color: #4338ca;">Goodwill Connect Credential</strong>
      <span class="badge">● Digitally Verified</span>
    </div>
    <div class="row">
      <span class="label">Verified Service Hours:</span>
      <span class="val" style="color: #047857;">40.0 Hours</span>
    </div>
    <div class="row">
      <span class="label">Active Cohort:</span>
      <span class="val">Google AI Ethics & Accessibility</span>
    </div>
    <div class="row">
      <span class="label">Accreditation ID:</span>
      <span class="val" style="font-family: monospace;">GWI-2026-AI-883921</span>
    </div>
    <div class="btn-row">
      <a href="https://goodwillindustriesinternational.com.ai" target="_blank" class="btn">View Live Transcript</a>
      <a href="https://goodwillindustriesinternational.com.ai" target="_blank" class="btn btn-secondary">Export ESG Record</a>
    </div>
  </div>
</body>
</html>
